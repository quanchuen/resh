name: Go

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.libc }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        libc: [glibc, musl]
        include:
          - libc: glibc
            image: trixie
          - libc: musl
            image: alpine3.24
    container: golang:${{ matrix.go }}-${{ matrix.image }}
    env:
      # Test with the Go version of the image instead of the toolchain from go.mod
      GOTOOLCHAIN: local
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:trixie-slim
    steps:

      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish

      - name: Upload Linux archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resh-linux-amd64
          path: dist/resh_*_linux_amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  install:
    name: Install (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie-slim
            setup: apt-get update && apt-get install -y --no-install-recommends zsh
          - image: alpine:3.24
            setup: apk add --no-cache bash coreutils zsh
    container: ${{ matrix.image }}
    steps:

      - name: Install dependencies
        run: ${{ matrix.setup }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resh-linux-amd64
          path: dist

      - name: Install and check RESH
        run: .github/scripts/test-install.sh dist/resh_*_linux_amd64.tar.gz
